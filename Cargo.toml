[package]
name = "open-diy"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8.0" }
leptos_router = { version = "0.8.0" }
axum = { version = "0.8.0", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["fs", "set-header"], optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
leptos_axum = { version = "0.8.0", optional = true }
leptos_meta = { version = "0.8.0" }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
wasm-bindgen = { version = "0.2.106", optional = true }
js-sys = { version = "0.3.72", optional = true }
web-sys = { version = "0.3.100", features = ["Window", "Document", "Element", "Storage", "MediaQueryList"] }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry"], optional = true }
tracing-opentelemetry = { version = "0.33.0", optional = true }
opentelemetry = { version = "0.32.0", optional = true }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.32.0", features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls"], optional = true }
axum-tracing-opentelemetry = { version = "0.38.0", optional = true }
opentelemetry-appender-tracing = { version = "0.32.0", optional = true }
pyroscope = { version = "2.0.6", features = ["backend-pprof-rs"], optional = true }

[features]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:js-sys",
]
ssr = [
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "dep:tokio",
    "dep:leptos_axum",
    "dep:pyroscope",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]
trailing_telemetry = [
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:axum-tracing-opentelemetry",
    "dep:opentelemetry-appender-tracing",
]

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
# The name used by wasm-bindgen/cargo-leptos for the JS/WASM bundle. Defaults to the crate name
output-name = "open-diy"

# The site root folder is where cargo-leptos generate all output. WARNING: all content of this folder will be erased on a rebuild. Use it in your server setup.
site-root = "target/site"

# The site-root relative folder where all compiled output (JS, WASM and CSS) is written
# Defaults to pkg
site-pkg-dir = "pkg"

# [Optional] The source CSS file. If it ends with .sass or .scss then it will be compiled by dart-sass into CSS. The CSS is optimized by Lightning CSS before being written to <site-root>/<site-pkg>/open-diy.css
style-file = "style/main.scss"
# Assets source dir. All files found here will be copied and synchronized to site-root.
# The assets-dir cannot have a sub directory with the same name/path as site-pkg-dir.
#
# Optional. Env: LEPTOS_ASSETS_DIR.
assets-dir = "public"

# The IP and port (ex: 127.0.0.1:3000) where the server serves the content. Use it in your server setup.
site-addr = "127.0.0.1:3000"

# The port to use for automatic reload monitoring
reload-port = 3001

#  The browserlist query used for optimizing the CSS.
browserquery = "defaults"

# The environment Leptos will run in, usually either "DEV" or "PROD"
env = "DEV"

# Generate hashes for compiled JS/WASM/CSS files to bust cache on deployment.
#
# A previous attempt at this (see git history) broke JS/WASM entirely, but
# not because Leptos lacks support for it — <HydrationScripts> in the
# `leptos` crate itself (src/hydration/mod.rs) does read a hash for both
# js and wasm, same as <HashedStylesheet> does for css. The actual bug was
# that this repo's Dockerfile never copied cargo-leptos's generated
# `hash.txt` into the final image — it only copied the binary and
# target/site. <HydrationScripts> looks for hash.txt next to the running
# executable (`current_exe().parent()`), didn't find it, and silently fell
# back to plain "open-diy.js"/"open-diy.wasm" — filenames that no longer
# existed on disk once cargo-leptos had already hashed them at build time.
# Fixed now: Dockerfile copies hash.txt next to the binary, and
# LEPTOS_HASH_FILES=true tells the running server to actually use it.
#
# Also requires using <HashedStylesheet options .../> instead of
# <Stylesheet href="..."/> for the CSS link — the plain <Stylesheet>
# component is explicitly documented as not hash-aware.
hash-files = true




# The features to use when compiling the bin target
#
# Optional. Can be over-ridden with the command line parameter --bin-features
bin-features = ["ssr", "trailing_telemetry"]

# If the --no-default-features flag should be used when compiling the bin target
#
# Optional. Defaults to false.
bin-default-features = false

# The features to use when compiling the lib target
#
# Optional. Can be over-ridden with the command line parameter --lib-features
lib-features = ["hydrate"]

# If the --no-default-features flag should be used when compiling the lib target
#
# Optional. Defaults to false.
lib-default-features = false

# The profile to use for the lib target when compiling for release
#
# Optional. Defaults to "release".
lib-profile-release = "wasm-release"
